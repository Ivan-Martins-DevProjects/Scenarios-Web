<div class="dashboard">
  <section class="welcome">
    <h1>Olá, {{ firstName() }} 👋</h1>
    <p>Sua sessão está ativa e protegida por um token JWT com validade de 8 horas.</p>
  </section>

  <section class="tools-grid">
    @for (tool of tools; track tool.name) {
      <a class="tool-card" [routerLink]="tool.link">
        <div class="tool-icon">
          @switch (tool.icon) {
            @case ('book') {
              <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path d="M4 3.5A1.5 1.5 0 012.5 5v10.5A1.5 1.5 0 004 17h13.5a.5.5 0 00.5-.5v-12a.5.5 0 00-.5-.5H4zm0 12V5h12.5v10.5H4z" />
                <path d="M6 7h8v1.2H6zM6 9.8h8V11H6zM6 12.6h5v1.2H6z" />
              </svg>
            }
            @case ('tool') {
              <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path
                  fill-rule="evenodd"
                  d="M13.6 2.6a4.5 4.5 0 00-4.98 6.11L2.3 15.02a1.5 1.5 0 000 2.12l.56.56a1.5 1.5 0 002.12 0l6.31-6.32A4.5 4.5 0 0017.4 6.4l-2.1 2.1-2.8-2.8 2.1-2.1z"
                  clip-rule="evenodd" />
              </svg>
            }
          }
        </div>
        <div class="tool-text">
          <h3>{{ tool.name }}</h3>
          <p>{{ tool.description }}</p>
        </div>
      </a>
    }
  </section>
</div>
